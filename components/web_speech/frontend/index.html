<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 150px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent !important; 
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .mic-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(79, 209, 197, 0.4);
            opacity: 0;
            pointer-events: none;
        }

        .mic-btn.recording ~ .pulse-ring:nth-child(1) { animation: pulse 1.5s infinite; }
        .mic-btn.recording ~ .pulse-ring:nth-child(2) { animation: pulse 1.5s infinite; animation-delay: 0.5s; }
        .mic-btn.recording ~ .pulse-ring:nth-child(3) { animation: pulse 1.5s infinite; animation-delay: 1.0s; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; border-color: rgba(186, 26, 26, 0.5); }
            100% { transform: scale(1.5); opacity: 0; border-color: rgba(186, 26, 26, 0); }
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            background: #4fd1c5; 
            color: #00504a;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0px 10px 20px -5px rgba(79, 209, 197, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn:hover {
            transform: scale(1.05);
        }

        .mic-btn.recording {
            background: #ba1a1a; 
            color: white;
            box-shadow: 0px 10px 20px -5px rgba(186, 26, 26, 0.4);
        }

        .material-symbols-outlined {
            font-size: 36px;
        }
    </style>
</head>
<body>

    <div class="mic-container">
        <button id="record-btn" class="mic-btn">
            <span class="material-symbols-outlined" id="mic-icon" style="font-variation-settings: 'FILL' 1;">mic</span>
        </button>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
    </div>

    <script>
        // --- 1. THE STREAMLIT HANDSHAKE (FIXED) ---
        function sendMessageToStreamlit(type, data) {
            window.parent.postMessage({isStreamlitMessage: true, type: type, ...data}, "*");
        }
        
        // We MUST tell Streamlit we are ready, otherwise it stays stuck on the loading box!
        function initStreamlit() {
            sendMessageToStreamlit("streamlit:componentReady", {apiVersion: 1});
            sendMessageToStreamlit("streamlit:setFrameHeight", {height: 150});
        }
        
        function sendValue(value) {
            sendMessageToStreamlit("streamlit:setComponentValue", {value: value});
        }

        window.addEventListener("load", initStreamlit);
        window.addEventListener("resize", () => sendMessageToStreamlit("streamlit:setFrameHeight", {height: 150}));

        // --- 2. AUDIO RECORDING LOGIC ---
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        
        const recordBtn = document.getElementById('record-btn');
        const micIcon = document.getElementById('mic-icon');

        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { noiseSuppression: true, echoCancellation: true } 
                    });
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result.split(',')[1];
                            sendValue({ audio_b64: base64Audio, mime_type: 'audio/webm', preview: '' });
                        };
                        audioChunks = [];
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    micIcon.textContent = 'stop_circle';
                    
                } catch (err) {
                    console.error("Microphone access denied:", err);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
                micIcon.textContent = 'mic';
                
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                
                recordBtn.disabled = true;
                recordBtn.style.opacity = "0.5";
                
                setTimeout(() => {
                    recordBtn.disabled = false;
                    recordBtn.style.opacity = "1";
                }, 2500);
            }
        };
    </script>
</body>
</html>
